<script>
    // 📦 ถุงจำลองเก็บค่าฟังก์ชันคำนวณและดึงข้อมูลของหน้า Dashboard เท่านั้น
    window.dashboardPage = {
        init() {
            console.log("⚡ หน้า Dashboard โหลดสำเร็จ: รันคำสั่งดึงยอดรวมสถิติตามรอบปกติ");
        },





        dashboardFilter(startdate, enddate) {

            return {
                startDate: '',
                endDate: '',
                errorMessage: '',
                metrics: { total: 0, inProgress: 0, completed: 0 },
                // 1. คลังเก็บสถิติจำลองเฉพาะของหน้า Dashboard (ตัดขาดจาก Global app.js)
                total: 25,       /* จำนวนจ็อบทั้งหมด */
                pending: 10,     /* กำลังตรวจ/รอแก้ไข */
                completed: 15,   /* ตรวจเสร็จแล้ว */

                // 2. ฟังก์ชันสูตรคิดเปอร์เซ็นต์สดบนหน้าจอ ป้องกันการหารด้วยศูนย์ (Division by zero)
                getPercent(current, total) {
                    if (!total || total === 0) return 0;
                    return Math.round((current / total) * 100);
                },

                // 1. ตั้งค่าเริ่มต้นให้เป็นวันที่ปัจจุบัน และย้อนหลังไป 7 วัน
                initDates() {
                    const today = new Date();
                    const sevenDaysAgo = new Date();
                    sevenDaysAgo.setDate(today.getDate() - 7);

                    this.endDate = today.toISOString().split('T')[0];
                    this.startDate = sevenDaysAgo.toISOString().split('T')[0];

                    // ดึงข้อมูลครั้งแรกเมื่อโหลดหน้าเว็บ
                    this.fetchData();
                },

                // 2. ฟังก์ชันตรวจสอบห้ามเลือกเกิน 1 เดือน
                validateRange() {
                    this.errorMessage = '';

                    if (!this.startDate || !this.endDate) return;

                    const start = new Date(this.startDate);
                    const end = new Date(this.endDate);

                    // เช็กกรณีผู้ใช้เลือกวันเริ่มต้น หลัง วันสิ้นสุด
                    if (start > end) {
                        this.errorMessage = '❌ วันเริ่มต้องไม่เกินวันสิ้นสุดครับ';
                        return false;
                    }

                    // คำนวณความต่างของเวลา (มิลลิวินาที)
                    const diffTime = Math.abs(end - start);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    // ตรวจเงื่อนไขห้ามเกิน 31 วัน (1 เดือน)
                    if (diffDays > 31) {
                        this.errorMessage = `❌ เลือกช่วงวันที่ห่างกันได้ไม่เกิน 1 เดือน (คุณเลือก ${diffDays} วัน)`;
                        return false;
                    }

                    return true;
                },

                // 3. ฟังก์ชันยิง API ดึงข้อมูลตามช่วงวันที่เลือก
                async fetchData() {
                    if (!this.validateRange()) return;

                    this.metrics = {

    document.addEventListener('alpine:init', () => {
        Alpine.data('flowbiteChartComponent', () => ({
            // กำหนดข้อมูลตัวแปรสถิติของคุณ
            total: 25,
            pending: 10,
            completed: 15,

            init() {
                // รอให้ DOM และ x-ref เรนเดอร์บนเบราว์เซอร์เสร็จสิ้นก่อนวาดกราฟ
                this.$nextTick(() => {
                    const options = {
                        series: [
                            {
                                name: 'กำลังตรวจ / รอแก้ไข',
                                data: [this.pending],
                                color: '#FBBF24' // สีเหลืองส้ม (40%)
                            },
                            {
                                name: 'ตรวจเสร็จแล้ว',
                                data: [this.completed],
                                color: '#10B981' // สีเขียว (60%)
                            }
                        ],
                        chart: {
                            type: 'bar',
                            height: 50, // ปรับความสูงกราฟให้แบนติดแนวราบ
                            stacked: true, // เปิดโหมดรวมแท่งให้ซ้อนต่อท้ายกัน
                            stackType: 'normal',
                            sparkline: {
                                enabled: true // โหมดซ่อนเส้นกริด แกนตัวเลข และขอบ เพื่อความคลีนสไตล์ Flowbite
                            },
                            toolbar: { show: false }
                        },
                        plotOptions: {
                            bar: {
                                horizontal: true, // สั่งให้แท่งกราฟยืดเป็นแนวนอน
                                barHeight: '100%', // ความหนาของแถบกราฟเต็มพื้นที่บรรจุ
                                borderRadius: 0 // ตัดความโค้งมนออกเพื่อให้แท่งสองสีต่อชนกันสนิท
                            }
                        },
                        stroke: { width: 0 },
                        states: {
                            hover: { filter: { type: 'none' } }
                        },
                        tooltip: {
                            enabled: true,
                            x: { show: false },
                            y: {
                                formatter: (val) => `${val} งาน (${Math.round((val / this.total) * 100)}%)`
                            }
                        }
                    };

                    // สั่งเรนเดอร์กราฟใส่ Element ผ่าน x-ref ของ Alpine
                    const chart = new ApexCharts(this.$refs.chartTimeline, options);
                    chart.render();
                });
            }
        }));
    });

    // สั่งรันคำสั่งเริ่มต้นทำงานของหน้าตัวเอง
    window.dashboardPage.init();

    // 🧹 ทำความสะอาดถุงข้อมูลเมื่อผู้ใช้กระโดดหนีไปเปิดเมนูหน้าอื่น เพื่อสุขอนามัยของแรมเครื่องคอมพิวเตอร์
    window.currentPageCleanup = function () {
        console.log("🧹 ล้างคลังความจำเฉพาะของหน้า Dashboard ออกเรียบร้อย");
        window.dashboardPage = null;
    };
</script>
