    <!-- บังคับโหลดสคริปต์สลับแท็บ Alpine.js แบบไม่หน่วงเวลา (นำไปวางบรรทัดแรกสุดของโค้ดชิ้นนี้) -->


    <!-- สไตล์สำรองฉุกเฉิน กรณี Tailwind CDN ไม่โหลด หน้าจอจะยังคงเป็นบล็อกสวยงาม -->

        }

        .tab-active-red {

        .flex-row-header {

            border: 1px solid #d1d5db;

        .data-table {
            w-full text-left border-collapse text-sm
        }

        .table-responsive {
            overflow-x: auto;

        }

        table {
            width: 100%;
            border-collapse: collapse;

        }

        th {
            background-color: #f9fafb;

        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f3f4f6;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 9999px;

            border: none;
            cursor: pointer;
            min-width: 80px;
        }

        .status-active {

    <!-- กล่องหลักคุมระบบด้วย Alpine.js -->
    <div x-data="{ 
        currentTab: 'type', 
        searchQuery: '',
        answers: [
            { code: 'ANS-01', name: 'ชุดมาตรฐาน ผ่าน / ไม่ผ่าน (Yes / No)', type: 'ตัวเลือก', icon: 'fa-circle-dot', options: '2 ตัวเลือก', active: true },
            { code: 'ANS-02', name: 'ชุดประเมินงานแม่บ้าน 5 ระดับ (ความสะอาด)', type: 'ตัวเลือก', icon: 'fa-circle-dot', options: '5 ตัวเลือก', active: false },
            { code: 'ANS-03', name: 'ชุดตรวจวัดอุณหภูมิตู้หลัก MDB (องศา)', type: 'กรอกตัวเลข', icon: 'fa-keyboard', options: '20 - 45', active: true }
        ],
        get filteredAnswers() {
            return this.answers.filter(item => item.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || item.code.toLowerCase().includes(this.searchQuery.toLowerCase()))
        }
    }" class="custom-card max-w-6xl mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-6 text-gray-700">

        <!-- แถบเมนูสลับแท็บ (Tabs) -->
        <!-- แถบเมนูสลับแท็บ (Tabs) -->
        <div class="tab-bar flex items-center space-x-6 border-b border-gray-200 pb-4 mb-6">
            <button onclick="loadTab('tab-type.html','btn-type' )" id="btn-type"
                class="tab-btn pb-2 flex items-center space-x-2 transition cursor-pointer tab-active-teal text-teal-600 border-b-2 border-teal-600 font-semibold">
                <i class="fa-solid fa-list-check"></i> <span>ประเภทคำตอบ</span>
            </button>
            <button onclick="loadTab('tab-group.html', 'btn-group')" id="btn-group"
                class="tab-btn pb-2 flex items-center space-x-2 transition cursor-pointer">
                <i class="fa-solid fa-folder-open"></i> <span>หมวดหมู่คำถาม (ผูกคำตอบ)</span>
            </button>
            <button onclick="loadTab('question')" id="btn-question"
                class="tab-btn pb-2 flex items-center space-x-2 transition cursor-pointer">
                <i class="fa-solid fa-clipboard-question"></i> <span>คำถาม (ผูก Work Type)</span>
            </button>
        </div>

        <!-- กล่องเปล่าสำหรับรองรับเนื้อหาจากไฟล์อื่นมาแสดง โค้ดจะไม่บวมอีกต่อไป -->
<div id="tab-content-container">
    <!-- เนื้อหาจากไฟล์ภายนอกจะมาโผล่ตรงนี้อัตโนมัติ -->
</div>

       


           

           <script>
// ฟังก์ชันโหลดไฟล์ HTML ภายนอกมาแสดงผล
function loadTab(fileName, buttonId) {
    const container = document.getElementById('tab-content-container');
    
    // โหลดไฟล์ด้วยคำสั่ง fetch
    
    fetch(fileName)
        .then(response => {
            if (!response.ok) throw new Error('หาไฟล์ไม่เจอ');
            return response.text();
        })
        .then(html => {
            // นำเนื้อหาในไฟล์มาใส่ในกล่องหลัก
            container.innerHTML = html;
            
            // สลับสีไฮไลท์ที่ปุ่มแท็บ
            const buttons = ['btn-type', 'btn-group'];
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.className = "tab-btn pb-2 flex items-center space-x-2 transition cursor-pointer";
            });
            
            // ไฮไลท์ปุ่มที่กดเลือกให้เป็นสีตามธีม
            const activeBtn = document.getElementById(buttonId);
            if (buttonId === 'btn-type') {
                activeBtn.className = "tab-btn pb-2 flex items-center space-x-2 transition cursor-pointer tab-active-teal text-teal-600 border-b-2 border-teal-600 font-semibold";
            } else if (buttonId === 'btn-group') {
                activeBtn.className = "tab-btn pb-2 flex items-center space-x-2 transition cursor-pointer tab-active-amber text-amber-500 border-b-2 border-amber-500 font-semibold";
            }
        })
        .catch(error => {
            container.innerHTML = `<div style="padding:20px; color:red; text-align:center;">เกิดข้อผิดพลาด: ไม่สามารถโหลดหน้าจอได้</div>`;
        });
}

// สั่งให้โหลดหน้าแรก (tab-type.html) ขึ้นมาแสดงทันทีเมื่อเปิดเว็บครั้งแรก
document.addEventListener("DOMContentLoaded", function() {
    loadTab('tab-type.html', 'btn-type');
});
</script>
